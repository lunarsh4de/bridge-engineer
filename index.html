<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#142b27" />
    <meta
      name="description"
      content="Build your own bridges. Test an idea, follow the forces, and connect Riverbend."
    />
    <title>Bridge Engineer — Riverbend</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="vendor/phaser-3.90.0.min.js" defer></script>
    <script src="js/physics.js" defer></script>
    <script src="js/levels.js" defer></script>
    <script src="js/model.js" defer></script>
    <script src="js/progress.js" defer></script>
    <script src="js/content.js" defer></script>
    <script src="js/art.js" defer></script>
    <script src="js/engine.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-screen="home">
    <div class="app-shell">
      <main class="workshop" id="workshop">
        <canvas
          id="scene"
          tabindex="-1"
          aria-label="Bridge building canvas. Use arrow keys and Enter to place endpoints. H opens help."
        ></canvas>
        <header class="topbar">
          <div id="workshop-nav" class="workshop-nav" hidden inert>
            <button id="home" class="nav-button" title="Return to main menu">
              ← Menu
            </button>
            <button id="missions" class="mission-select">
              <span id="mission-label">01 / Willow Creek</span> <span>⌄</span>
            </button>
            <button id="task" class="nav-button">Task</button>
          </div>
          <div class="topbar-right">
            <nav id="play-nav" aria-label="Workshop navigation" hidden inert>
              <button id="notebook" class="nav-button">Notebook</button>
              <button id="help" class="nav-button">Help</button>
            </nav>
            <button id="about" class="nav-button about-button">About</button>
          </div>
        </header>
        <section id="main-menu" class="main-menu" aria-labelledby="game-title">
          <div class="menu-content">
            <p class="menu-location">RIVERBEND</p>
            <h1 id="game-title">BRIDGE<br /><span>ENGINEER</span></h1>
            <div class="menu-actions">
              <button id="start" class="menu-start" disabled>
                Start <span aria-hidden="true">→</span>
              </button>
              <button id="select-level" class="menu-select" disabled>
                Select level
              </button>
            </div>
          </div>
        </section>
        <section
          id="level-select"
          class="level-select"
          hidden
          inert
          aria-labelledby="select-title"
        >
          <div class="selection-heading">
            <div>
              <p class="eyebrow">YOUR ROUTE THROUGH RIVERBEND</p>
              <h1 id="select-title">Choose a crossing.</h1>
            </div>
            <button id="selection-back" class="small-button">← Back</button>
          </div>
          <div id="level-cards" class="level-cards"></div>
          <div class="selection-footer">
            <p>Start with timber. Build further. Discover new materials.</p>
            <button
              id="explore-toggle"
              class="text-button"
              aria-pressed="false"
            >
              Explore all levels
            </button>
          </div>
        </section>
        <div id="play-ui" class="play-ui" hidden inert>
          <div class="task-status" aria-label="Crossing conditions">
            <span id="span-value">6 m</span><span id="load-value">600 kg</span
            ><span id="drop-limit">Drop &lt; 12 cm</span>
          </div>
          <div id="storage-status" class="storage-status" role="status" hidden>
            Not saved on this device
          </div>
          <aside
            class="simulation-panel panel"
            id="simulation-panel"
            hidden
            aria-label="Simulation measurements"
          >
            <div class="simulation-heading">
              <span class="eyebrow" id="mode-text">CROSSING TEST</span
              ><button id="back-build" class="text-button">Edit design</button>
            </div>
            <div class="live-measurements">
              <div>
                <span>TIME</span
                ><strong id="time-value">0.0 <small>s</small></strong>
              </div>
              <div>
                <span>MAX. DROP</span
                ><strong id="sag-value">0 <small>cm</small></strong>
              </div>
              <div><span>BROKEN</span><strong id="broken-value">0</strong></div>
            </div>
            <div class="simulation-controls">
              <button id="pause" class="small-button">Pause</button
              ><button id="speed" class="small-button">Speed 1×</button>
            </div>
          </aside>
          <section
            class="feedback panel"
            id="feedback-panel"
            hidden
            aria-label="Experiment result"
          >
            <div class="feedback-heading">
              <span class="eyebrow" id="feedback-label">TEST RESULT</span
              ><button id="dismiss-feedback" aria-label="Dismiss result">
                ×
              </button>
            </div>
            <h2 id="feedback-title"></h2>
            <p id="feedback-body" role="status"></p>
            <p id="result-reward" class="result-reward" hidden></p>
            <div class="feedback-actions">
              <button class="primary" id="result-edit">Edit design</button
              ><button class="small-button" id="result-compare">
                Compare tests</button
              ><button class="small-button" id="next" hidden>
                Next crossing →
              </button>
            </div>
          </section>
          <div class="view-controls panel" aria-label="View options">
            <button id="grid" class="view-button active" aria-pressed="true">
              Grid</button
            ><button id="stress" class="view-button" aria-pressed="false">
              Forces</button
            ><button id="zoom-out" class="view-button" aria-label="Zoom out">
              −</button
            ><button id="zoom-in" class="view-button" aria-label="Zoom in">
              +
            </button>
          </div>
          <div
            class="instruction"
            id="instruction"
            role="status"
            aria-live="polite"
            hidden
          ></div>
          <div class="materials-dock panel" id="materials-dock">
            <div
              id="materials"
              class="material-list"
              role="group"
              aria-label="Construction materials"
            ></div>
            <div class="dock-tools">
              <button id="move" class="edit-button" aria-pressed="false">
                Move</button
              ><button id="erase" class="edit-button" aria-pressed="false">
                Erase</button
              ><button
                id="undo"
                class="edit-button"
                aria-label="Undo"
                title="Undo (Ctrl/Cmd Z)"
              >
                ↶</button
              ><button
                id="redo"
                class="edit-button"
                aria-label="Redo"
                title="Redo (Ctrl/Cmd Shift Z)"
              >
                ↷</button
              ><button
                id="clear"
                class="edit-button"
                aria-label="Restart this design"
                title="Restart this design"
              >
                ↺</button
              ><button id="cancel-placement" class="edit-button" hidden>
                Cancel
              </button>
            </div>
            <div class="test-actions">
              <button id="gravity" class="gravity-button">Self-weight</button
              ><button id="test" class="primary">
                Test crossing <span aria-hidden="true">→</span>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <button id="close-modal" class="close" aria-label="Close dialog">
        ×
      </button>
      <div id="modal-body"></div>
    </dialog>
    <input
      id="import-file"
      type="file"
      accept=".json,application/json"
      hidden
    />
    <noscript>This game needs JavaScript. Enable it to play.</noscript>
  </body>
</html>
